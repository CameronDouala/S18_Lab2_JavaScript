<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">

        <title>Exemple</title>
		
        <link rel="stylesheet" href="css/styles.css"/>
	</head>
    <body>
        <div class="wrapper">
            <p class="titre">Exemples avec each</p>
            <ul class="cartes">
                <li class="pique1"></li>
                <li class="pique1"></li>
                <li class="pique1"></li>
                <li class="pique1"></li>
                <li class="pique1"></li>
                <li class="pique1"></li>
